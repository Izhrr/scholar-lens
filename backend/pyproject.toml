[project]
name = "scholarlens-backend"
version = "0.1.0"
description = "ScholarLens API: PDF ingestion and citation-grounded hybrid RAG chat"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20",
    "chromadb-client==1.5.9",
    "fastapi[standard]>=0.162",
    "langchain-text-splitters>=1.1",
    "openai>=3.42",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) defaults

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"app/generation/prompts.py" = ["E501"]  # prompt text reads better unwrapped
